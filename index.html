
<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nova AI</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080808;color:#eee;font-family:Arial,sans-serif}
header{height:65px;border-bottom:1px solid #252525;display:flex;align-items:center;padding:0 18px;gap:10px;font-size:21px;font-weight:bold}
.logo{background:#8b5cf6;border-radius:12px;padding:9px}
.purple{color:#a78bfa}
#chat{max-width:760px;margin:auto;padding:22px 16px 130px}
.welcome{text-align:center;margin:15vh 0 35px}
.welcome h1{font-size:32px;margin-bottom:10px}
.welcome p{color:#999}
.msg{padding:14px 17px;margin:18px 0;border-radius:16px;line-height:1.65;white-space:pre-wrap;overflow-wrap:anywhere}
.user{background:#252525;margin-left:35px}
.ai{background:#111;margin-right:15px}
#form{position:fixed;bottom:0;left:0;right:0;background:#080808;border-top:1px solid #252525;padding:14px;display:flex;gap:9px}
#input{flex:1;min-width:0;background:#191919;border:1px solid #333;border-radius:15px;color:white;padding:14px;font-size:16px;outline:none}
#input:focus{border-color:#8b5cf6}
button{border:0;border-radius:13px;background:#8b5cf6;color:white;padding:0 18px;font-size:20px;cursor:pointer}
button:disabled{opacity:.5}
#status{font-size:12px;color:#999;margin-left:auto;font-weight:normal}
.note{text-align:center;color:#777;font-size:12px;margin-top:15px}
</style>
</head>
<body>
<header>
  <span class="logo">✦</span>
  <span>Nova <span class="purple">AI</span></span>
  <span id="status">● Pregătit</span>
</header>

<main id="chat">
  <div class="welcome" id="welcome">
    <h1>Salut! Sunt <span class="purple">Nova AI</span></h1>
    <p>Ce vrei să explorăm astăzi?</p>
  </div>
</main>

<form id="form">
  <input id="input" placeholder="Scrie un mesaj..." autocomplete="off" required>
  <button id="send" type="submit">➤</button>
</form>

<script>
const chat=document.querySelector("#chat");
const form=document.querySelector("#form");
const input=document.querySelector("#input");
const send=document.querySelector("#send");
const statusText=document.querySelector("#status");
const welcome=document.querySelector("#welcome");
const history=[];

function addMessage(text,role){
  const el=document.createElement("div");
  el.className="msg "+role;
  el.textContent=text;
  chat.appendChild(el);
  window.scrollTo({top:document.body.scrollHeight,behavior:"smooth"});
  return el;
}

form.addEventListener("submit",async e=>{
  e.preventDefault();
  const text=input.value.trim();
  if(!text||send.disabled)return;
  welcome.style.display="none";
  addMessage(text,"user");
  history.push({role:"user",content:text});
  input.value="";
  send.disabled=true;
  statusText.textContent="● Se gândește...";
  const answer=addMessage("Se conectează la AI...","ai");

  try{
    const response=await fetch("/api/chat",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({messages:history.slice(-12)})
    });
    const data=await response.json();
    if(!response.ok)throw new Error(data.error||"Eroare de conexiune");
    answer.textContent=data.reply;
    history.push({role:"assistant",content:data.reply});
  }catch(err){
    answer.textContent="Nu m-am putut conecta la AI. Trebuie configurat serverul și modelul AI înainte să pot răspunde. ("+err.message+")";
    history.pop();
  }finally{
    send.disabled=false;
    statusText.textContent="● Pregătit";
    input.focus();
  }
});
</script>
</body>
</html>
